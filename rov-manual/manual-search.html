<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manual Search — Hercules MK3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0d14;color:#c8c4b8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;}
#hdr{padding:14px 18px;background:#090c13;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#ttl{font-family:monospace;font-size:10px;color:#e8a44a;letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase;}
#sr{display:flex;gap:8px;}
#q{flex:1;background:#1a1d24;border:1px solid #2a2d35;border-radius:4px;padding:9px 14px;color:#c8c4b8;font-size:13px;outline:none;}
#q:focus{border-color:#e8a44a;}
#sb{background:#e8a44a;color:#000;border:none;border-radius:4px;padding:9px 18px;cursor:pointer;font-weight:700;font-size:11px;font-family:monospace;letter-spacing:.08em;}
#sb:hover{background:#f0b830;}
#res{flex:1;overflow-y:auto;padding:12px 18px;}
.rc{background:#141720;border:1px solid #2a2d35;border-radius:6px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.rc:hover{border-color:#e8a44a;background:#181c26;}
.rp{font-family:monospace;font-size:9px;color:#e8a44a;margin-bottom:5px;letter-spacing:.06em;}
.rt{font-size:12px;line-height:1.65;color:#a8a49a;}
.rt mark{background:rgba(232,164,74,.2);color:#e8c47a;border-radius:2px;padding:0 2px;}
.ro{margin-top:7px;font-family:monospace;font-size:9px;color:#6090e0;}
#st{padding:6px 18px;font-family:monospace;font-size:9px;color:#505460;flex-shrink:0;border-top:1px solid #1a1d24;}
#em{padding:48px;text-align:center;color:#505460;font-family:monospace;font-size:10px;line-height:2;}
.open-btn{display:inline-block;margin-top:12px;padding:8px 16px;background:rgba(232,164,74,.1);border:1px solid rgba(232,164,74,.3);border-radius:4px;color:#e8a44a;font-family:monospace;font-size:9px;cursor:pointer;text-decoration:none;letter-spacing:.08em;}
.open-btn:hover{background:rgba(232,164,74,.2);}
</style>
</head>
<body>
<div id="hdr">
  <div id="ttl">&#128269; Manual Search &mdash; <span id="manual-name">Loading...</span></div>
  <div id="sr">
    <input id="q" type="text" placeholder="Search sections, topics, part numbers, fault symptoms..." autofocus>
    <button id="sb" onclick="doSearch()">SEARCH</button>
  </div>
</div>
<div id="res">
  <div id="em">
    Enter a search term to find relevant sections<br>
    Results are AI-matched to your query using semantic search<br><br>
    <a id="open-full" href="#" target="_blank" class="open-btn">&#128196; OPEN FULL MANUAL IN NEW TAB</a>
  </div>
</div>
<div id="st"></div>
<script>
// Get params from URL
const params = new URLSearchParams(window.location.search);
const MANUAL = params.get('manual') || '';
const CONFIG_URL = 'https://rov-chatbot-production-3d66.up.railway.app/api/config';

let SU = '', SA = '';
let configLoaded = false;

// Update header
document.getElementById('manual-name').textContent = MANUAL;
const fullLink = document.getElementById('open-full');
if (fullLink) fullLink.href = 'manuals/' + MANUAL;

// Load config
fetch(CONFIG_URL)
  .then(r => r.json())
  .then(cfg => {
    SU = cfg.supabaseUrl;
    SA = cfg.supabaseAnon;
    configLoaded = true;
  })
  .catch(() => {
    document.getElementById('st').textContent = 'Warning: not connected to database — search unavailable';
  });

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!configLoaded || !SU) {
    document.getElementById('res').innerHTML = '<div id="em">Not connected to database.<br>Check internet connection to Railway.</div>';
    return;
  }

  const st = document.getElementById('st');
  const res = document.getElementById('res');
  st.textContent = 'Searching...';
  res.innerHTML = '<div id="em" style="color:#605860;">Searching for: ' + esc(q) + '</div>';

  try {
    let chunks = [];

    // Vector search first
    const r = await fetch(SU + '/rest/v1/rpc/match_chunks', {
      method: 'POST',
      headers: {
        'apikey': SA,
        'Authorization': 'Bearer ' + SA,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ query_text: q, match_count: 30 })
    });
    if (r.ok) {
      const all = await r.json();
      chunks = all.filter(c => c.manual_name === MANUAL);
    }

    // Fallback to text search if vector returns nothing for this manual
    if (!chunks.length) {
      const r2 = await fetch(
        SU + '/rest/v1/chunks?manual_name=eq.' + encodeURIComponent(MANUAL)
        + '&text=ilike.*' + encodeURIComponent(q.substring(0, 30)) + '*&limit=20',
        { headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA } }
      );
      if (r2.ok) chunks = await r2.json();
    }

    if (!chunks.length) {
      res.innerHTML = '<div id="em">No results found for: <strong style="color:#e8a44a;">' + esc(q) + '</strong><br><br>'
        + '<a href="manuals/' + MANUAL + '" target="_blank" class="open-btn">&#128196; Open full manual</a></div>';
      st.textContent = '';
      return;
    }

    st.textContent = chunks.length + ' sections found — click any result to open that page in the manual';

    res.innerHTML = chunks.map(c => {
      const pg = extractPage(c.page_label);
      const highlighted = highlight(esc(c.text.substring(0, 400)), q);
      const more = c.text.length > 400 ? '...' : '';
      return '<div class="rc" onclick="openPage(' + pg + ')">'
        + '<div class="rp">&#128196; ' + esc(c.page_label) + '</div>'
        + '<div class="rt">' + highlighted + more + '</div>'
        + '<div class="ro">&#9654; Open manual at page ' + pg + '</div>'
        + '</div>';
    }).join('');

  } catch (e) {
    res.innerHTML = '<div id="em">Search error: ' + esc(e.message) + '</div>';
    st.textContent = '';
  }
}

function openPage(page) {
  window.open('manuals/' + MANUAL + '#page=' + page, '_blank');
}

function extractPage(label) {
  const m = (label || '').match(/\d+/);
  return m ? parseInt(m[0]) : 1;
}

function highlight(text, query) {
  const words = query.split(/\s+/).filter(Boolean);
  let result = text;
  words.forEach(w => {
    const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    result = result.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark>$1</mark>');
  });
  return result;
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>

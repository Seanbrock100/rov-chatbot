<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manual Viewer — Hercules MK3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0d14;color:#c8c4b8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#090c13;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#topbar-title{font-family:monospace;font-size:10px;color:#e8a44a;letter-spacing:.1em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:320px;flex-shrink:0;background:#0d1018;border-right:1px solid #2a2d35;display:flex;flex-direction:column;overflow:hidden;transition:width .2s;}
#sidebar.collapsed{width:0;}
#sb-header{padding:10px 14px;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#sb-label{font-family:monospace;font-size:9px;color:#e8a44a;letter-spacing:.12em;margin-bottom:7px;}
#sr{display:flex;gap:6px;}
#q{flex:1;background:#1a1d24;border:1px solid #2a2d35;border-radius:3px;padding:7px 10px;color:#c8c4b8;font-size:12px;outline:none;min-width:0;}
#q:focus{border-color:#e8a44a;}
#sb-btn{background:#e8a44a;color:#000;border:none;border-radius:3px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:10px;font-family:monospace;flex-shrink:0;}
#sb-btn:hover{background:#f0b830;}
#sb-results{flex:1;overflow-y:auto;padding:8px 0;}
#sb-status{padding:4px 14px;font-family:monospace;font-size:8px;color:#505460;flex-shrink:0;border-top:1px solid #1a1d24;}
.rc{padding:10px 14px;cursor:pointer;border-bottom:1px solid #1a1d24;transition:background .12s;}
.rc:hover{background:#181c26;}
.rp{font-family:monospace;font-size:8px;color:#e8a44a;margin-bottom:4px;}
.rt{font-size:11px;line-height:1.55;color:#8a8680;}
.rt mark{background:rgba(232,164,74,.2);color:#e8c47a;border-radius:2px;}
.ro{margin-top:5px;font-family:monospace;font-size:8px;color:#6090e0;}
#em{padding:30px 14px;text-align:center;color:#505460;font-family:monospace;font-size:9px;line-height:2;}
#pdf-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#pdf-frame{flex:1;border:none;width:100%;background:#222;}
#toggle-btn{background:rgba(232,164,74,.1);border:1px solid rgba(232,164,74,.3);color:#e8a44a;border-radius:3px;padding:5px 10px;cursor:pointer;font-family:monospace;font-size:9px;white-space:nowrap;}
#toggle-btn:hover{background:rgba(232,164,74,.2);}
#page-hint{font-family:monospace;font-size:8px;color:#505460;padding:0 8px;}
</style>
</head>
<body>
<div id="topbar">
  <button id="toggle-btn" onclick="toggleSidebar()">&#128269; SEARCH</button>
  <span id="topbar-title">Loading...</span>
  <span id="page-hint"></span>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sb-header">
      <div id="sb-label">&#128269; SEARCH THIS MANUAL</div>
      <div id="sr">
        <input id="q" type="text" placeholder="Topic, part number, fault..." autofocus>
        <button id="sb-btn" onclick="doSearch()">GO</button>
      </div>
    </div>
    <div id="sb-results"><div id="em">Search to find relevant sections<br>Click any result to jump to that page</div></div>
    <div id="sb-status"></div>
  </div>
  <div id="pdf-wrap">
    <iframe id="pdf-frame" src="" title="Manual"></iframe>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const MANUAL = params.get('manual') || '';
const CFG_URL = 'https://rov-chatbot-production-3d66.up.railway.app/api/config';
let SU = '', SA = '', cfgOk = false;
let currentPage = 1;

// Set title and load PDF
document.getElementById('topbar-title').textContent = MANUAL;
document.title = MANUAL + ' — Hercules MK3';
loadPdf(1);

// Load config
fetch(CFG_URL).then(r => r.json()).then(cfg => {
  SU = cfg.supabaseUrl; SA = cfg.supabaseAnon; cfgOk = true;
}).catch(() => {
  document.getElementById('sb-status').textContent = 'Offline — search unavailable';
});

// Keyboard: Enter to search
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function loadPdf(page) {
  currentPage = page;
  const frame = document.getElementById('pdf-frame');
  frame.src = 'manuals/' + MANUAL + (page > 1 ? '#page=' + page : '');
  document.getElementById('page-hint').textContent = page > 1 ? 'p.' + page : '';
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  document.getElementById('toggle-btn').textContent =
    sb.classList.contains('collapsed') ? '&#128269; SEARCH' : '&#10005; HIDE';
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!cfgOk) {
    document.getElementById('sb-results').innerHTML = '<div id="em">Not connected to database</div>';
    return;
  }
  const st = document.getElementById('sb-status');
  const res = document.getElementById('sb-results');
  st.textContent = 'Searching...';
  res.innerHTML = '<div id="em" style="color:#404860;">Searching for: ' + esc(q) + '</div>';

  try {
    let chunks = [];

    // Strategy 1: vector search filtered to this manual only
    const r1 = await fetch(SU + '/rest/v1/rpc/match_chunks', {
      method: 'POST',
      headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_text: q + ' ' + MANUAL, match_count: 50 })
    });
    if (r1.ok) {
      const all = await r1.json();
      chunks = all.filter(c => c.manual_name === MANUAL);
    }

    // Strategy 2: text search within this manual (catches keyword misses from vector search)
    if (chunks.length < 3) {
      const terms = q.split(/\s+/).filter(Boolean);
      const orClauses = terms.map(t => 'text.ilike.*' + encodeURIComponent(t.substring(0, 25)) + '*').join(',');
      const r2 = await fetch(
        SU + '/rest/v1/chunks?manual_name=eq.' + encodeURIComponent(MANUAL) + '&or=(' + orClauses + ')&limit=20',
        { headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA } }
      );
      if (r2.ok) {
        const textResults = await r2.json();
        // Merge, deduplicate by id
        const seen = new Set(chunks.map(c => c.id));
        textResults.forEach(c => { if (!seen.has(c.id)) { chunks.push(c); seen.add(c.id); } });
      }
    }

    if (!chunks.length) {
      res.innerHTML = '<div id="em">No results for: <strong style="color:#e8a44a;">' + esc(q) + '</strong></div>';
      st.textContent = '';
      return;
    }

    st.textContent = chunks.length + ' sections — click to jump';
    res.innerHTML = chunks.slice(0, 25).map(c => {
      const pg = extractPage(c.page_label);
      return '<div class="rc" onclick="loadPdf(' + pg + ')">'
        + '<div class="rp">&#128196; ' + esc(c.page_label) + '</div>'
        + '<div class="rt">' + hi(esc(c.text.substring(0, 220)), q) + (c.text.length > 220 ? '...' : '') + '</div>'
        + '<div class="ro">&#9654; Jump to page ' + pg + '</div>'
        + '</div>';
    }).join('');

  } catch (e) {
    res.innerHTML = '<div id="em">Error: ' + esc(e.message) + '</div>';
    st.textContent = '';
  }
}

function extractPage(label) {
  const m = (label || '').match(/\d+/);
  return m ? parseInt(m[0]) : 1;
}

function hi(text, query) {
  const words = query.split(/\s+/).filter(Boolean);
  let r = text;
  words.forEach(w => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    r = r.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>

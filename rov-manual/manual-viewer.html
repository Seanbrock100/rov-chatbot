<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manual Viewer — Hercules MK3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0d14;color:#c8c4b8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
/* TOP BAR */
#topbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#090c13;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#topbar-title{font-family:monospace;font-size:10px;color:#e8a44a;letter-spacing:.1em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#toggle-btn{background:rgba(232,164,74,.1);border:1px solid rgba(232,164,74,.3);color:#e8a44a;border-radius:3px;padding:4px 10px;cursor:pointer;font-family:monospace;font-size:9px;white-space:nowrap;flex-shrink:0;}
#toggle-btn:hover{background:rgba(232,164,74,.2);}
/* MAIN LAYOUT */
#main{display:flex;flex:1;overflow:hidden;}
/* SIDEBAR */
#sidebar{width:300px;flex-shrink:0;background:#0d1018;border-right:1px solid #2a2d35;display:flex;flex-direction:column;overflow:hidden;transition:width .18s;}
#sidebar.collapsed{width:0;}
#sb-hdr{padding:10px 12px;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#sb-lbl{font-family:monospace;font-size:9px;color:#e8a44a;letter-spacing:.1em;margin-bottom:6px;}
#sr{display:flex;gap:5px;}
#q{flex:1;background:#1a1d24;border:1px solid #2a2d35;border-radius:3px;padding:6px 9px;color:#c8c4b8;font-size:12px;outline:none;min-width:0;}
#q:focus{border-color:#e8a44a;}
#go{background:#e8a44a;color:#000;border:none;border-radius:3px;padding:6px 11px;cursor:pointer;font-weight:700;font-size:10px;font-family:monospace;flex-shrink:0;}
#go:hover{background:#f0b830;}
#sb-res{flex:1;overflow-y:auto;padding:6px 0;}
#sb-st{padding:4px 12px 5px;font-family:monospace;font-size:8px;color:#505460;flex-shrink:0;border-top:1px solid #1a1d24;}
.rc{padding:9px 12px;cursor:pointer;border-bottom:1px solid #1a1d24;transition:background .1s;}
.rc:hover{background:#181c26;}
.rc.open{background:#181c26;border-left:2px solid #e8a44a;}
.rp{font-family:monospace;font-size:8px;color:#e8a44a;margin-bottom:3px;}
.rt{font-size:11px;line-height:1.5;color:#8a8680;}
.rt mark{background:rgba(232,164,74,.2);color:#e8c47a;border-radius:2px;}
.ro{margin-top:4px;font-family:monospace;font-size:8px;color:#6090e0;}
#em{padding:28px 12px;text-align:center;color:#505460;font-family:monospace;font-size:9px;line-height:2.2;}
/* RIGHT: TAB PANE */
#right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
/* PDF TAB STRIP */
#pdf-tabs{display:flex;align-items:center;background:#090c13;border-bottom:1px solid #2a2d35;overflow-x:auto;flex-shrink:0;min-height:32px;}
#pdf-tabs::-webkit-scrollbar{height:2px;}
#pdf-tabs::-webkit-scrollbar-thumb{background:#2a2d35;}
.pt{display:flex;align-items:center;gap:5px;padding:0 10px;height:32px;font-family:monospace;font-size:9px;color:#606470;cursor:pointer;border-bottom:2px solid transparent;border-right:1px solid #1a1d24;white-space:nowrap;flex-shrink:0;transition:all .1s;}
.pt:hover{color:#c8c4b8;background:rgba(255,255,255,.03);}
.pt.active{color:#e8a44a;border-bottom-color:#e8a44a;background:rgba(232,164,74,.05);}
.pt-close{color:#505460;padding:1px 3px;border-radius:2px;font-size:11px;line-height:1;}
.pt-close:hover{background:rgba(255,80,80,.2);color:#ff6060;}
/* PDF FRAMES */
#pdf-area{flex:1;position:relative;background:#1a1a1a;}
.pf{position:absolute;inset:0;border:none;width:100%;height:100%;display:none;}
.pf.active{display:block;}
/* WELCOME SCREEN */
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#404860;font-family:monospace;font-size:10px;text-align:center;line-height:2;}
#welcome a{color:#6090e0;text-decoration:none;}
#welcome a:hover{text-decoration:underline;}
#welcome .big{font-size:28px;opacity:.2;}
</style>
</head>
<body>
<div id="topbar">
  <button id="toggle-btn" onclick="toggleSidebar()">&#128269; SEARCH</button>
  <span id="topbar-title">Loading...</span>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sb-hdr">
      <div id="sb-lbl">&#128269; SEARCH THIS MANUAL</div>
      <div id="sr">
        <input id="q" type="text" placeholder="Topic, part number, fault..." autofocus>
        <button id="go" onclick="doSearch()">GO</button>
      </div>
    </div>
    <div id="sb-res"><div id="em">Search to find sections<br>Results open as tabs on the right<br><br><span style="color:#e8a44a;font-size:8px;">AI semantic search</span></div></div>
    <div id="sb-st"></div>
  </div>
  <div id="right">
    <div id="pdf-tabs"></div>
    <div id="pdf-area">
      <div id="welcome">
        <div class="big">&#128196;</div>
        <div>Search for a topic in the sidebar<br>or open the full manual below</div>
        <a id="open-all" href="#" target="_blank">&#8599; Open full manual in browser</a>
      </div>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const MANUAL = params.get('manual') || '';
const CFG_URL = 'https://rov-chatbot-production-3d66.up.railway.app/api/config';
let SU = '', SA = '', cfgOk = false;

// Tabs state: [{id, page, label, active}]
let tabs = [], tabSeq = 0;

// Init
document.getElementById('topbar-title').textContent = MANUAL;
document.title = MANUAL + ' \u2014 Hercules MK3';
document.getElementById('open-all').href = 'manuals/' + MANUAL;

// Open page 1 on load
openTab(1, 'Cover');

// Load config
fetch(CFG_URL).then(r => r.json()).then(cfg => {
  SU = cfg.supabaseUrl; SA = cfg.supabaseAnon; cfgOk = true;
}).catch(() => {
  document.getElementById('sb-st').textContent = 'Offline \u2014 search unavailable';
});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const collapsed = sb.classList.toggle('collapsed');
  document.getElementById('toggle-btn').textContent = collapsed ? '&#128269; SEARCH' : '&#10005; HIDE';
}

// ── TAB MANAGEMENT ────────────────────────────────────────────────────────────
function openTab(page, label) {
  // If tab for this page already exists, just activate it
  const existing = tabs.find(t => t.page === page);
  if (existing) { activateTab(existing.id); return; }

  const id = 'pt' + (++tabSeq);
  tabs.push({ id, page, label: label || 'p.' + page, loaded: false });

  // Create iframe but DON'T set src yet — lazy load on activate
  const frame = document.createElement('iframe');
  frame.id = 'frame-' + id;
  frame.className = 'pf';
  frame.title = label || 'Page ' + page;
  document.getElementById('pdf-area').appendChild(frame);

  renderTabs();
  activateTab(id);

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';
}

function activateTab(id) {
  tabs.forEach(t => t.active = (t.id === id));
  // Show/hide frames
  document.querySelectorAll('.pf').forEach(f => f.classList.remove('active'));
  const tab = tabs.find(t => t.id === id);
  const frame = document.getElementById('frame-' + id);
  if (frame) {
    // Lazy load: only set src when first activated
    if (tab && !tab.loaded) {
      frame.src = 'manuals/' + MANUAL + '#page=' + tab.page;
      tab.loaded = true;
    }
    frame.classList.add('active');
  }
  renderTabs();
  // Highlight matching search result
  if (tab) {
    document.querySelectorAll('.rc').forEach(el => {
      el.classList.toggle('open', parseInt(el.dataset.page) === tab.page);
    });
  }
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  const wasActive = tabs[idx].active;

  // Remove frame
  const frame = document.getElementById('frame-' + id);
  if (frame) frame.remove();
  tabs.splice(idx, 1);
  renderTabs();

  if (wasActive && tabs.length) {
    activateTab(tabs[Math.max(0, idx - 1)].id);
  } else if (!tabs.length) {
    document.getElementById('welcome').style.display = 'flex';
  }
}

function renderTabs() {
  const strip = document.getElementById('pdf-tabs');
  strip.innerHTML = tabs.map(t => {
    const act = t.active ? ' active' : '';
    return '<div class="pt' + act + '" data-id="' + t.id + '" onclick="activateTab(this.dataset.id)">'
      + '<span style="pointer-events:none;">&#128196; ' + esc(t.label) + '</span>'
      + '<span class="pt-close" data-id="' + t.id + '" onclick="closeTab(this.dataset.id,event)">\u00d7</span>'
      + '</div>';
  }).join('');
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!cfgOk || !SU) {
    document.getElementById('sb-res').innerHTML = '<div id="em">Not connected to database</div>';
    return;
  }
  const st = document.getElementById('sb-st');
  const res = document.getElementById('sb-res');
  st.textContent = 'Searching...';
  res.innerHTML = '<div id="em" style="color:#404860;">Searching: ' + esc(q) + '</div>';

  try {
    let chunks = [];

    // Vector search biased to this manual
    const r1 = await fetch(SU + '/rest/v1/rpc/match_chunks', {
      method: 'POST',
      headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_text: q + ' ' + MANUAL, match_count: 50 })
    });
    if (r1.ok) {
      const all = await r1.json();
      chunks = all.filter(c => c.manual_name === MANUAL);
    }

    // Keyword fallback if vector returns <3 results
    if (chunks.length < 3) {
      const terms = q.split(/\s+/).filter(Boolean);
      const orClauses = terms.map(t => 'text.ilike.*' + encodeURIComponent(t.substring(0, 25)) + '*').join(',');
      const r2 = await fetch(
        SU + '/rest/v1/chunks?manual_name=eq.' + encodeURIComponent(MANUAL) + '&or=(' + orClauses + ')&limit=20',
        { headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA } }
      );
      if (r2.ok) {
        const extra = await r2.json();
        const seen = new Set(chunks.map(c => c.id));
        extra.forEach(c => { if (!seen.has(c.id)) { chunks.push(c); seen.add(c.id); } });
      }
    }

    if (!chunks.length) {
      res.innerHTML = '<div id="em">No results for: <strong style="color:#e8a44a;">' + esc(q) + '</strong></div>';
      st.textContent = '';
      return;
    }

    st.textContent = chunks.length + ' sections \u2014 click to open as tab';
    res.innerHTML = chunks.slice(0, 30).map(c => {
      const pg = extractPage(c.page_label);
      return '<div class="rc" data-page="' + pg + '" onclick="openTab(' + pg + ',' + JSON.stringify('p.' + pg + ' ' + c.page_label.substring(0,12)) + ')">'
        + '<div class="rp">&#128196; ' + esc(c.page_label) + '</div>'
        + '<div class="rt">' + hi(esc(c.text.substring(0, 200)), q) + (c.text.length > 200 ? '...' : '') + '</div>'
        + '<div class="ro">&#9654; Open as tab</div>'
        + '</div>';
    }).join('');

  } catch (e) {
    res.innerHTML = '<div id="em">Error: ' + esc(e.message) + '</div>';
    st.textContent = '';
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function extractPage(label) {
  const m = (label || '').match(/\d+/);
  return m ? parseInt(m[0]) : 1;
}

function hi(text, query) {
  const words = query.split(/\s+/).filter(Boolean);
  let r = text;
  words.forEach(w => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    r = r.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manual Viewer — Hercules MK3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0d14;color:#c8c4b8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#090c13;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#topbar-title{font-family:monospace;font-size:10px;color:#e8a44a;letter-spacing:.1em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:340px;flex-shrink:0;background:#0d1018;border-right:1px solid #2a2d35;display:flex;flex-direction:column;overflow:hidden;transition:width .2s;}
#sidebar.collapsed{width:0;overflow:hidden;}
#sb-header{padding:10px 14px;border-bottom:1px solid #2a2d35;flex-shrink:0;}
#sb-label{font-family:monospace;font-size:9px;color:#e8a44a;letter-spacing:.12em;margin-bottom:7px;}
#sr{display:flex;gap:6px;}
#q{flex:1;background:#1a1d24;border:1px solid #2a2d35;border-radius:3px;padding:7px 10px;color:#c8c4b8;font-size:12px;outline:none;min-width:0;}
#q:focus{border-color:#e8a44a;}
#sb-btn{background:#e8a44a;color:#000;border:none;border-radius:3px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:10px;font-family:monospace;flex-shrink:0;}
#sb-btn:hover{background:#f0b830;}
#sb-results{flex:1;overflow-y:auto;padding:8px 0;}
#sb-status{padding:4px 14px 6px;font-family:monospace;font-size:8px;color:#505460;flex-shrink:0;border-top:1px solid #1a1d24;}
.rc{padding:10px 14px;cursor:pointer;border-bottom:1px solid #1a1d24;transition:background .12s;}
.rc:hover{background:#181c26;}
.rc.active-result{background:#181c26;border-left:2px solid #e8a44a;}
.rp{font-family:monospace;font-size:8px;color:#e8a44a;margin-bottom:4px;}
.rt{font-size:11px;line-height:1.55;color:#8a8680;}
.rt mark{background:rgba(232,164,74,.2);color:#e8c47a;border-radius:2px;}
.ro{margin-top:5px;font-family:monospace;font-size:8px;color:#6090e0;}
#em{padding:30px 14px;text-align:center;color:#505460;font-family:monospace;font-size:9px;line-height:2.2;}
#pdf-wrap{flex:1;position:relative;background:#1a1a1a;display:flex;align-items:center;justify-content:center;}
#pdf-placeholder{text-align:center;font-family:monospace;font-size:10px;color:#404860;line-height:2.5;}
#pdf-placeholder a{color:#e8a44a;text-decoration:none;}
#pdf-placeholder a:hover{text-decoration:underline;}
#toggle-btn{background:rgba(232,164,74,.1);border:1px solid rgba(232,164,74,.3);color:#e8a44a;border-radius:3px;padding:5px 10px;cursor:pointer;font-family:monospace;font-size:9px;white-space:nowrap;flex-shrink:0;}
#toggle-btn:hover{background:rgba(232,164,74,.2);}
#open-full-btn{background:rgba(96,144,224,.1);border:1px solid rgba(96,144,224,.3);color:#6090e0;border-radius:3px;padding:5px 10px;cursor:pointer;font-family:monospace;font-size:9px;white-space:nowrap;flex-shrink:0;text-decoration:none;}
#open-full-btn:hover{background:rgba(96,144,224,.2);}
#page-indicator{font-family:monospace;font-size:9px;color:#505460;flex-shrink:0;}
</style>
</head>
<body>
<div id="topbar">
  <button id="toggle-btn" onclick="toggleSidebar()">&#128269; SEARCH</button>
  <span id="topbar-title">Loading...</span>
  <span id="page-indicator"></span>
  <a id="open-full-btn" href="#" target="_blank">&#128196; OPEN FULL MANUAL</a>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sb-header">
      <div id="sb-label">&#128269; SEARCH THIS MANUAL</div>
      <div id="sr">
        <input id="q" type="text" placeholder="Topic, part number, fault symptom..." autofocus>
        <button id="sb-btn" onclick="doSearch()">GO</button>
      </div>
    </div>
    <div id="sb-results">
      <div id="em">
        Search to find relevant sections<br>
        Results open at the exact page<br><br>
        <span style="color:#e8a44a;font-size:8px;">AI-powered semantic search</span>
      </div>
    </div>
    <div id="sb-status"></div>
  </div>
  <div id="pdf-wrap">
    <div id="pdf-placeholder">
      <div style="font-size:32px;margin-bottom:12px;opacity:.3;">&#128196;</div>
      <div id="ph-text">Search for a topic in the sidebar<br>then click a result to open that page</div><br>
      <a id="ph-open-link" href="#" target="_blank">&#8599; Open full manual in this window</a>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const MANUAL = params.get('manual') || '';
const CFG_URL = 'https://rov-chatbot-production-3d66.up.railway.app/api/config';
let SU = '', SA = '', cfgOk = false;
let pdfWindow = null;

// Set up page
document.getElementById('topbar-title').textContent = MANUAL;
document.title = MANUAL + ' — Hercules MK3';
document.getElementById('open-full-btn').href = 'manuals/' + MANUAL;
document.getElementById('ph-open-link').href = 'manuals/' + MANUAL;

// Load config
fetch(CFG_URL).then(r => r.json()).then(cfg => {
  SU = cfg.supabaseUrl;
  SA = cfg.supabaseAnon;
  cfgOk = true;
}).catch(() => {
  document.getElementById('sb-status').textContent = 'Offline — search unavailable';
});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const collapsed = sb.classList.toggle('collapsed');
  document.getElementById('toggle-btn').textContent = collapsed ? '&#128269; SEARCH' : '&#10005; HIDE';
}

function openPage(page) {
  // Open the PDF at the specific page in a new browser tab
  // Each click opens a fresh tab at exactly the right page — no iframe reloading issues
  const url = 'manuals/' + MANUAL + '#page=' + page;
  window.open(url, '_blank');
  // Update the indicator in the topbar
  document.getElementById('page-indicator').textContent = 'Opened p.' + page;
  // Highlight the active result
  document.querySelectorAll('.rc').forEach(el => el.classList.remove('active-result'));
  const clicked = document.querySelector('.rc[data-page="' + page + '"]');
  if (clicked) clicked.classList.add('active-result');
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!cfgOk || !SU) {
    document.getElementById('sb-results').innerHTML =
      '<div id="em">Not connected to database.<br>Check internet access.</div>';
    return;
  }
  const st = document.getElementById('sb-status');
  const res = document.getElementById('sb-results');
  st.textContent = 'Searching...';
  res.innerHTML = '<div id="em" style="color:#404860;">Searching for: ' + esc(q) + '...</div>';

  try {
    let chunks = [];

    // Strategy 1: vector search biased to this manual
    const r1 = await fetch(SU + '/rest/v1/rpc/match_chunks', {
      method: 'POST',
      headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query_text: q + ' ' + MANUAL, match_count: 50 })
    });
    if (r1.ok) {
      const all = await r1.json();
      chunks = all.filter(c => c.manual_name === MANUAL);
    }

    // Strategy 2: keyword fallback within this manual
    if (chunks.length < 3) {
      const terms = q.split(/\s+/).filter(Boolean);
      const orClauses = terms.map(t =>
        'text.ilike.*' + encodeURIComponent(t.substring(0, 25)) + '*'
      ).join(',');
      const r2 = await fetch(
        SU + '/rest/v1/chunks?manual_name=eq.' + encodeURIComponent(MANUAL)
        + '&or=(' + orClauses + ')&limit=20',
        { headers: { 'apikey': SA, 'Authorization': 'Bearer ' + SA } }
      );
      if (r2.ok) {
        const extra = await r2.json();
        const seen = new Set(chunks.map(c => c.id));
        extra.forEach(c => { if (!seen.has(c.id)) { chunks.push(c); seen.add(c.id); } });
      }
    }

    if (!chunks.length) {
      res.innerHTML = '<div id="em">No results for: <strong style="color:#e8a44a;">'
        + esc(q) + '</strong><br><br>'
        + '<a href="manuals/' + MANUAL + '" target="_blank" style="color:#6090e0;">Open full manual</a></div>';
      st.textContent = '';
      return;
    }

    st.textContent = chunks.length + ' sections found — click to open at that page';
    res.innerHTML = chunks.slice(0, 25).map(c => {
      const pg = extractPage(c.page_label);
      return '<div class="rc" data-page="' + pg + '" onclick="openPage(' + pg + ')">'
        + '<div class="rp">&#128196; ' + esc(c.page_label) + '</div>'
        + '<div class="rt">' + hi(esc(c.text.substring(0, 220)), q)
        + (c.text.length > 220 ? '...' : '') + '</div>'
        + '<div class="ro">&#8599; Opens PDF at page ' + pg + '</div>'
        + '</div>';
    }).join('');

  } catch (e) {
    res.innerHTML = '<div id="em">Error: ' + esc(e.message) + '</div>';
    st.textContent = '';
  }
}

function extractPage(label) {
  const m = (label || '').match(/\d+/);
  return m ? parseInt(m[0]) : 1;
}

function hi(text, query) {
  const words = query.split(/\s+/).filter(Boolean);
  let r = text;
  words.forEach(w => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    r = r.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
  });
  return r;
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hercules MK3 — Drawing Family Tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e16;--surface:#13171f;--surface2:#181c26;--border:#1e2330;--border2:#2a3040;
  --amber:#e8a44a;--amber-dim:#7a5018;--text:#ddd8cc;--text-dim:#6a7080;
  --text-mid:#9a9890;--blue:#4a7fa0;--blue-dim:#2a4a60;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* ── HEADER ── */
#hdr{border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;background:#090c13;flex-shrink:0;}
.htitle{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#f0ece0;letter-spacing:-.01em;}
.hbadge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;padding:2px 8px;border-radius:2px;border:1px solid var(--amber);color:var(--amber);background:rgba(232,164,74,.08);}
.hback{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);cursor:pointer;padding:4px 10px;border:1px solid var(--border2);border-radius:2px;text-decoration:none;transition:all .15s;}
.hback:hover{border-color:var(--amber);color:var(--amber);}
.hsep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.hright{display:flex;align-items:center;gap:10px;margin-left:auto;}
#search-wrap{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface);border:1px solid var(--border2);border-radius:3px;transition:border-color .15s;}
#search-wrap:focus-within{border-color:var(--amber);}
#search{background:transparent;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);width:200px;}
#search::placeholder{color:var(--text-dim);}
.s-icon{font-size:12px;color:var(--text-dim);}
#match-count{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);min-width:48px;}
.s-clear{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);cursor:pointer;padding:0 2px;transition:color .15s;display:none;}
.s-clear:hover{color:var(--amber);}

/* ── BREADCRUMB ── */
#breadcrumb{
  padding:8px 24px;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  min-height:38px;flex-shrink:0;
}
.bc-home{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);cursor:pointer;letter-spacing:.05em;transition:opacity .15s;}
.bc-home:hover{opacity:.7;}
.bc-sep{font-size:10px;color:var(--border2);margin:0 2px;}
.bc-crumb{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);cursor:pointer;letter-spacing:.05em;transition:color .15s;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bc-crumb:hover{color:var(--text);}
.bc-crumb.current{color:var(--text);cursor:default;}
.bc-back{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-mid);cursor:pointer;padding:2px 10px;border:1px solid var(--border2);border-radius:2px;transition:all .15s;margin-right:6px;}
.bc-back:hover{border-color:var(--amber);color:var(--amber);}

/* ── MAIN ── */
#main{flex:1;padding:28px 24px;overflow-y:auto;}

/* Section header */
#section-hdr{margin-bottom:22px;}
#section-hdr .sh-id{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:4px;}
#section-hdr .sh-title{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#f0ece0;letter-spacing:-.01em;line-height:1.2;}
#section-hdr .sh-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.1em;margin-top:6px;}

/* ── CARD GRID ── */
#card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:10px;
  animation:fadeUp .18s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── CARD ── */
.card{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:6px;
  padding:13px 15px 11px;
  display:flex;flex-direction:column;gap:7px;
  position:relative;
  transition:border-color .15s, background .15s, transform .12s, box-shadow .15s;
  min-height:110px;
}
.card.clickable{cursor:pointer;}
.card.clickable:hover{
  border-color:var(--amber);
  background:var(--surface2);
  transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.card.is-wiring.clickable:hover{border-color:var(--blue);}
.card.no-action{opacity:.45;cursor:not-allowed;}

/* PDF quick-open badge (top-right corner for nodes that drill AND have PDF) */
.card-pdf-btn{
  position:absolute;top:10px;right:10px;
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.05em;
  color:var(--amber);border:1px solid var(--amber-dim);border-radius:2px;
  padding:1px 5px;background:rgba(232,164,74,.08);
  cursor:pointer;transition:all .15s;z-index:2;
}
.card-pdf-btn:hover{background:rgba(232,164,74,.18);}
.card.is-wiring .card-pdf-btn{color:var(--blue);border-color:var(--blue-dim);background:rgba(74,127,160,.08);}
.card.is-wiring .card-pdf-btn:hover{background:rgba(74,127,160,.18);}

.card-num{
  font-family:'IBM Plex Mono',monospace;font-size:8px;
  color:var(--amber);letter-spacing:.08em;line-height:1.5;
  padding-right:40px;/* avoid overlap with pdf btn */
}
.card.is-wiring .card-num{color:var(--blue);}
.card.no-action .card-num{color:var(--text-dim);}

.card-divider{height:1px;background:var(--border);flex-shrink:0;}

.card-title{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:12px;font-weight:500;
  color:var(--text);line-height:1.45;flex:1;
}
.card.no-action .card-title{color:var(--text-dim);}

.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:2px;gap:6px;
}
.card-type{
  font-family:'IBM Plex Mono',monospace;font-size:8px;
  letter-spacing:.1em;padding:1px 6px;border-radius:2px;flex-shrink:0;
}
.type-assembly{color:var(--amber);border:1px solid var(--amber-dim);background:rgba(232,164,74,.05);}
.type-wiring{color:var(--blue);border:1px solid var(--blue-dim);background:rgba(74,127,160,.07);}
.type-none{color:var(--text-dim);border:1px solid var(--border);background:transparent;}

.card-action{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.04em;
  display:flex;align-items:center;gap:5px;
}
.ca-drill{color:var(--text-dim);}
.ca-count{
  font-family:'IBM Plex Mono',monospace;font-size:8px;
  color:var(--text-dim);background:var(--border2);border-radius:10px;
  padding:1px 6px;
}
.ca-pdf{color:var(--amber);}
.card.is-wiring .ca-pdf{color:var(--blue);}

/* ── SEARCH RESULTS ── */
#search-panel{display:none;animation:fadeUp .15s ease;}
#search-panel.active{display:block;}
.sr-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.1em;margin-bottom:12px;}
.sr-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  border:1px solid var(--border2);border-radius:4px;
  margin-bottom:7px;cursor:pointer;
  background:var(--surface);transition:all .15s;
}
.sr-item:hover{border-color:var(--amber);background:var(--surface2);}
.sr-item.is-wiring:hover{border-color:var(--blue);}
.sr-num{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--amber);min-width:170px;flex-shrink:0;}
.sr-item.is-wiring .sr-num{color:var(--blue);}
.sr-title{font-family:'IBM Plex Sans',monospace;font-size:12px;color:var(--text);flex:1;}
.sr-path{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text-dim);text-align:right;flex-shrink:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-pdf{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--amber);flex-shrink:0;}
.sr-item.is-wiring .sr-pdf{color:var(--blue);}
.sr-empty{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);padding:24px 0;text-align:center;letter-spacing:.08em;}
</style>
</head>

function getFile(id) {
  if (FILES[id]) return BASE + FILES[id];
  // Fallback: only match keys with the same suffix type (-00→-00, -90→-90, etc.)
  // This prevents assembly nodes (-00) from accidentally opening wiring diagrams (-90)
  const m = id.match(/^(.+)-(\d{2})$/);
  if (!m) return null;
  const [, base, suffix] = m;
  for (const k of Object.keys(FILES)) {
    if (k.startsWith(base + '-') && k.endsWith('-' + suffix)) return BASE + FILES[k];
  }
  return null;
}

// ── BUILD SEARCH INDEX ─────────────────────────────────────────────────────
const allNodes = [];
function indexNode(node, ancestors=[]) {
  node._ancestors = ancestors;
  allNodes.push(node);
  (node.children||[]).forEach(c => indexNode(c, [...ancestors, node]));
}
indexNode(TREE);

// ── NAVIGATION STATE ───────────────────────────────────────────────────────
let stack = [];   // ancestors of currentNode
let currentNode = TREE;

function navigate(node) {
  // If has children → drill in
  if (node.children && node.children.length > 0) {
    stack.push(currentNode);
    currentNode = node;
    clearSearch();
    renderView();
    return;
  }
  // Leaf → open PDF if available
  const url = getFile(node.id);
  if (url) window.open(url, '_blank');
}

function goBack() {
  if (stack.length === 0) return;
  currentNode = stack.pop();
  renderView();
}

function goHome() {
  stack = [];
  currentNode = TREE;
  clearSearch();
  renderView();
}

// ── BREADCRUMB ─────────────────────────────────────────────────────────────
function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';

  if (stack.length > 0) {
    const back = document.createElement('span');
    back.className = 'bc-back';
    back.textContent = '← BACK';
    back.onclick = goBack;
    bc.appendChild(back);
  }

  // Home
  const home = document.createElement('span');
  home.className = 'bc-home';
  home.textContent = 'HOME';
  home.onclick = goHome;
  bc.appendChild(home);

  // Ancestors from stack
  stack.forEach((node, i) => {
    const sep = document.createElement('span');
    sep.className = 'bc-sep';
    sep.textContent = '›';
    bc.appendChild(sep);

    const crumb = document.createElement('span');
    crumb.className = 'bc-crumb';
    crumb.textContent = node.label;
    crumb.title = node.id;
    crumb.onclick = () => {
      // Navigate to this ancestor
      stack = stack.slice(0, i);
      currentNode = node;
      renderView();
    };
    bc.appendChild(crumb);
  });

  // Current node (if not root)
  if (currentNode !== TREE) {
    const sep = document.createElement('span');
    sep.className = 'bc-sep';
    sep.textContent = '›';
    bc.appendChild(sep);

    const cur = document.createElement('span');
    cur.className = 'bc-crumb current';
    cur.textContent = currentNode.label;
    bc.appendChild(cur);
  }
}

// ── SECTION HEADER ─────────────────────────────────────────────────────────
function renderSectionHeader(node) {
  const isRoot = node === TREE;
  document.getElementById('sh-id').textContent = isRoot ? '' : node.id;
  document.getElementById('sh-title').textContent = isRoot
    ? 'ROV-0311-D-0000-01 — Hercules MK3 Vehicle Assembly'
    : node.label;
  const count = (node.children||[]).length;
  document.getElementById('sh-sub').textContent = isRoot
    ? `SELECT A SYSTEM TO EXPLORE ITS DRAWINGS — ${count} TOP-LEVEL SYSTEMS`
    : `${count} ITEM${count !== 1 ? 'S' : ''} IN THIS SECTION`;
}

// ── CARD RENDERING ─────────────────────────────────────────────────────────
function makeCard(node) {
  const hasChildren = node.children && node.children.length > 0;
  const childCount  = hasChildren ? node.children.length : 0;
  const fileUrl     = getFile(node.id);
  const isWiring    = node.type === 'w';
  const canAct      = hasChildren || fileUrl;

  const card = document.createElement('div');
  card.className = [
    'card',
    canAct ? 'clickable' : 'no-action',
    isWiring ? 'is-wiring' : '',
  ].join(' ');

  // PDF quick-open badge (only for drill-in nodes that also have a file)
  if (hasChildren && fileUrl) {
    const btn = document.createElement('span');
    btn.className = 'card-pdf-btn';
    btn.textContent = '↗ PDF';
    btn.title = 'Open PDF drawing';
    btn.onclick = e => { e.stopPropagation(); window.open(fileUrl, '_blank'); };
    card.appendChild(btn);
  }

  // Drawing number
  const num = document.createElement('div');
  num.className = 'card-num';
  num.textContent = node.id;
  card.appendChild(num);

  // Divider
  const div = document.createElement('div');
  div.className = 'card-divider';
  card.appendChild(div);

  // Title
  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = node.label;
  card.appendChild(title);

  // Footer
  const footer = document.createElement('div');
  footer.className = 'card-footer';

  // Type badge
  const badge = document.createElement('span');
  badge.className = 'card-type ' + (fileUrl
    ? (isWiring ? 'type-wiring' : 'type-assembly')
    : 'type-none');
  badge.textContent = fileUrl ? (isWiring ? 'WIRING' : 'ASSEMBLY') : 'NO FILE';
  footer.appendChild(badge);

  // Action indicator
  const act = document.createElement('span');
  act.className = 'card-action';
  if (hasChildren && !fileUrl) {
    act.innerHTML = `<span class="ca-drill">EXPLORE</span><span class="ca-count">${childCount}</span>`;
  } else if (hasChildren && fileUrl) {
    act.innerHTML = `<span class="ca-drill">EXPLORE</span><span class="ca-count">${childCount}</span>`;
  } else if (fileUrl) {
    act.innerHTML = `<span class="ca-pdf">↗ OPEN PDF</span>`;
  }
  footer.appendChild(act);
  card.appendChild(footer);

  // Click handler
  if (canAct) {
    card.onclick = () => navigate(node);
  }

  return card;
}

// ── RENDER CURRENT VIEW ────────────────────────────────────────────────────
function renderView() {
  renderBreadcrumb();
  renderSectionHeader(currentNode);

  const grid = document.getElementById('card-grid');
  const sp   = document.getElementById('search-panel');
  grid.innerHTML = '';
  sp.innerHTML   = '';
  sp.classList.remove('active');
  grid.style.display = '';

  // Force re-animation
  grid.style.animation = 'none';
  grid.offsetHeight; // reflow
  grid.style.animation = '';

  const items = currentNode === TREE
    ? currentNode.children   // home: show top-level branches
    : currentNode.children;

  (items || []).forEach(node => grid.appendChild(makeCard(node)));
}

// ── SEARCH ─────────────────────────────────────────────────────────────────
let searchTimeout;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(e.target.value.trim()), 120);
});

function doSearch(q) {
  const grid = document.getElementById('card-grid');
  const sp   = document.getElementById('search-panel');
  const mc   = document.getElementById('match-count');
  const clr  = document.getElementById('s-clear');

  if (!q || q.length < 2) {
    sp.innerHTML = '';
    sp.classList.remove('active');
    grid.style.display = '';
    mc.textContent = '';
    clr.style.display = 'none';
    renderSectionHeader(currentNode);
    return;
  }

  clr.style.display = 'inline';
  grid.style.display = 'none';

  const upper = q.toUpperCase();
  const hits = allNodes.filter(n =>
    n !== TREE &&
    (n.id.toUpperCase().includes(upper) || n.label.toUpperCase().includes(upper))
  );

  mc.textContent = hits.length + ' found';
  document.getElementById('sh-id').textContent = '';
  document.getElementById('sh-title').textContent = `Search: "${q}"`;
  document.getElementById('sh-sub').textContent = hits.length
    ? `${hits.length} DRAWING${hits.length !== 1 ? 'S' : ''} MATCHED`
    : 'NO MATCHES FOUND';

  sp.innerHTML = '';
  sp.classList.add('active');

  if (!hits.length) {
    const empty = document.createElement('div');
    empty.className = 'sr-empty';
    empty.textContent = 'No drawings matched "' + q + '"';
    sp.appendChild(empty);
    return;
  }

  hits.forEach(node => {
    const fileUrl  = getFile(node.id);
    const isWiring = node.type === 'w';
    const hasDrill = node.children && node.children.length > 0;

    const row = document.createElement('div');
    row.className = 'sr-item' + (isWiring ? ' is-wiring' : '');

    const numEl = document.createElement('span');
    numEl.className = 'sr-num';
    numEl.textContent = node.id;
    row.appendChild(numEl);

    const titleEl = document.createElement('span');
    titleEl.className = 'sr-title';
    titleEl.textContent = node.label;
    row.appendChild(titleEl);

    // Path
    const pathEl = document.createElement('span');
    pathEl.className = 'sr-path';
    pathEl.textContent = node._ancestors.slice(1).map(a => a.label).join(' › ');
    row.appendChild(pathEl);

    // PDF badge
    if (fileUrl) {
      const pdfEl = document.createElement('span');
      pdfEl.className = 'sr-pdf';
      pdfEl.textContent = '↗ PDF';
      row.appendChild(pdfEl);
    }

    row.onclick = () => {
      if (hasDrill) {
        // Navigate into this node's parent section, then scroll/highlight
        clearSearch();
        // Rebuild stack to this node's ancestors
        stack = node._ancestors.slice(1); // exclude root
        currentNode = node._ancestors[node._ancestors.length - 1] || TREE;
        // If the node itself has children, drill into it
        if (hasDrill) {
          stack = node._ancestors.slice(1);
          currentNode = node;
        }
        renderView();
      } else if (fileUrl) {
        window.open(fileUrl, '_blank');
      }
    };

    sp.appendChild(row);
  });
}

function clearSearch() {
  const el = document.getElementById('search');
  el.value = '';
  doSearch('');
}

// ── KEYBOARD ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('search').value) {
      clearSearch();
    } else {
      goBack();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// ── INIT ───────────────────────────────────────────────────────────────────
renderView();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROV Agentic Chatbot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:2px}
body{font-family:'IBM Plex Sans',sans-serif;background:#0e1118;color:#ddd8cc;min-height:100vh;display:flex;flex-direction:column}

#header{border-bottom:1px solid #1a1e28;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;background:#0b0e16;flex-shrink:0}
#header h1{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#f0ece0}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;padding:2px 8px;border-radius:2px;border:1px solid #00b4d8;color:#00b4d8;background:rgba(0,180,216,.08);margin-left:8px}
.badge-amber{border-color:#e8a44a;color:#e8a44a;background:rgba(232,164,74,.08)}
#status-bar{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4a5060;text-align:right}

#key-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
.key-inner{width:100%;max-width:440px}
.card{background:#13171f;border:1px solid #1e2330;border-radius:4px;padding:24px}
.card-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;color:#00b4d8;text-transform:uppercase;margin-bottom:10px}
.key-input{width:100%;background:#080b11;border:1px solid #2a3040;border-radius:3px;padding:11px 14px;color:#ddd8cc;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;letter-spacing:.05em;transition:border-color .2s;margin-bottom:10px}
.key-input:focus{border-color:#e8a44a}
.primary-btn{width:100%;background:#e8a44a;border:none;color:#0e1118;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;padding:12px;cursor:pointer;border-radius:3px;transition:background .15s;text-transform:uppercase}
.primary-btn:hover:not(:disabled){background:#d4923a}
.primary-btn:disabled{background:#2a2e3a;color:#4a5060;cursor:not-allowed}
.info-box{margin-top:18px;padding:14px;background:#13171f;border:1px solid #1e2330;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5a6070;line-height:1.9}
.info-highlight{color:#00b4d8}

#chat-screen{flex:1;overflow:hidden;display:flex;flex-direction:column;display:none}
#messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}

.msg-wrapper{}
.msg-role{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.msg-role.user{color:#4a7090}
.msg-role.assistant{color:#8a7040}
.msg-role.tool{color:#3a7a5a}

.msg-bubble{padding:14px 16px;border-radius:4px;font-size:13px;line-height:1.85;white-space:pre-wrap}
.msg-bubble.user{background:transparent;border:1px solid #1e2330;border-left:3px solid #3a5060;color:#a0b0c0}
.msg-bubble.assistant{background:#13171f;border:1px solid #1e2330;border-left:3px solid #e8a44a;color:#ccc8bc}
.msg-bubble.thinking{background:#0d1020;border:1px solid #1a2030;border-left:3px solid #00b4d8;color:#5a7080;font-family:'IBM Plex Mono',monospace;font-size:11px}
.msg-bubble.tool-call{background:#0d1a10;border:1px solid #1a2a1a;border-left:3px solid #3a7a5a;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5a9a6a}
.msg-bubble.tool-result{background:#0a100a;border:1px solid #1a2a1a;border-left:3px solid #2a5a3a;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4a7a5a}

.chunk-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:8px;border-top:1px solid #1e2230}
.chunk-pill{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid #2a3040;color:#5a7a6a;cursor:pointer;transition:all .15s}
.chunk-pill:hover{border-color:#00b4d8;color:#00b4d8}
.chunk-drawer{background:#080b11;border:1px solid #1e2230;border-radius:3px;padding:12px;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.7;color:#4a6a5a;max-height:180px;overflow-y:auto;display:none}
.chunk-drawer.open{display:block}

#input-bar{border-top:1px solid #1a1e28;padding:16px 24px;background:#0b0e16;flex-shrink:0}
#input-row{display:flex;gap:10px;align-items:flex-end;max-width:900px}
#input-field{flex:1;background:#13171f;border:1px solid #1e2330;border-radius:3px;padding:10px 14px;color:#ddd8cc;font-family:'IBM Plex Sans',sans-serif;font-size:13px;outline:none;resize:none;line-height:1.5}
#input-field:focus{border-color:#3a4050}
#send-btn{background:#e8a44a;border:none;color:#0e1118;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.08em;padding:10px 20px;cursor:pointer;border-radius:3px;transition:all .15s;white-space:nowrap}
#send-btn:hover:not(:disabled){background:#d4923a}
#send-btn:disabled{background:#2a2e3a;color:#4a5060;cursor:not-allowed}
#input-hint{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#2a3040;letter-spacing:.1em}

.spinner{width:10px;height:10px;border:2px solid #2a2e3a;border-top-color:#e8a44a;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;flex-shrink:0}
.spinner-teal{border-top-color:#00b4d8}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center">
    <h1>ROV Agentic Chatbot</h1>
    <span class="badge-amber badge">AGENTIC</span>
    <span class="badge">SEMANTIC SEARCH</span>
  </div>
  <div id="status-bar">SUBSEA 7 — SEVEN OCEANIC</div>
</div>

<!-- LOADING SCREEN -->
<div id="key-screen">
  <div class="key-inner">
    <div class="card" style="text-align:center">
      <div class="card-label">Initialising</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px">
        <span class="spinner"></span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6a7080">Loading configuration...</span>
      </div>
    </div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div id="messages"></div>
  <div id="input-bar">
    <div id="input-row">
      <textarea id="input-field" rows="2" placeholder="Describe the fault or ask a question in plain English..."></textarea>
      <button id="send-btn" disabled>Send ↵</button>
    </div>
    <div id="input-hint">ENTER TO SEND · SHIFT+ENTER NEW LINE · AGENTIC SEARCH · CLAUDE DECIDES WHAT TO LOOK UP</div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const CHUNK_SIZE = 400, CHUNK_OVERLAP = 50, TOP_K = 5;

// ── STATE ─────────────────────────────────────────────────────────────────────
let anthropicKey = '', voyageKey = '', supabaseUrl = '', supabaseAnon = '';
let chatHistory = [];
let isLoading = false;
let systemPrompt = '';

// ── SYSTEM PROMPT BUILDER ─────────────────────────────────────────────────────
// The master knowledge document is loaded here as the always-present Tier 1 context.
// In production this would be loaded from the knowledge document.
// For now it contains the core system knowledge from what we've read.
function buildSystemPrompt() {
  return `You are an expert ROV technical assistant for Subsea 7, specialising in the Hercules MK3 work-class ROV system aboard Seven Oceanic. You have deep knowledge of the complete system architecture.

VESSEL AND SYSTEM CONTEXT:
- Vessel: Seven Oceanic, Subsea 7
- ROVs: HE15 and HE30, Hercules MK3, 3,000msw rated
- LARS: Cursor moonpool deployment, MacArtney MASH 3500/34 winch, 440VAC/60Hz
- You are assisting: Sean Brock, Electronic Systems Specialist, HND Electrical & Electronic Engineering

CORE SYSTEM ARCHITECTURE:
The ROV has two-chassis electronics pod (control + payload), Rainbow CWDM fibre communications, 120HP hydraulic system.

COMMUNICATIONS PATH (topside to vehicle):
- Fibre 1 carries all CWDM comms. CWDM Red Band (ROV-0300-D-0215-00) wavelength assignments:
  * 1470nm: Serial data → RCM3200 interface PCBs
  * 1490nm: Gigabit Ethernet → Sixnet SLX-10MG switches (CRITICAL — loss = loss of ROV control)
  * 1510nm: 155MHz fibre interface PCB-0037
  * 1610nm: Digital video MUX PCB-0094
- WWDM Wide Band handles 8x Y/C video channels (cameras 1-8)
- CWDM Blue Band on payload chassis for survey sensors / HD video

POWER DISTRIBUTION (subsea):
- 24V buses: 4x MAX124 (PSU 4,5,6,7) for general loads; MAX315 triple (PSU 3) monitored; MAX124 PSU1 for camera power (24V/3 bus); 24V/4 general payload
- Camera power switches via Relay Board 1 (PCB-0163) Relays 5-12, one per camera, 24V/3 bus

CAMERA SYSTEM:
- Power path: 24V/3 bus → Relay Board 1 (PCB-0163) relays 5-12 → Camera bulkhead Pin 7 (+24V) Pin 8 (0V)
- Video path: Camera Y/C → bulkhead Pins 1+3 → Video MUX PCB-0124 → FO Interface PCB-0188 → WWDM fibre → surface matrix
- Focus/zoom: Camera Control PCB-0161 → RS232 → camera bulkhead Pins 5+6

HYDRAULIC SYSTEM:
- 190 lpm @ 250 bar main circuit
- VP1 + VP2: Curvetech 12-station RS485 via Cable 7 and Cable 18
- VP3 high flow: 4-station 32 lpm RS485 via Cable 18
- Manipulators: Schilling T4 (master, RS232 Cable 28) and Schilling Atlas (slave, via Allerton VP Centurion intelligent valve pack)
- Allerton VP is an intelligent valve pack with its own processor — diagnose VP comms before investigating arm

KEY PCBS (control chassis):
PCB-0163: Relay & Housekeeping (camera power, PSU monitoring)
PCB-0161: Camera Control (focus/zoom RS232)
PCB-0162: TCU Control (thrusters, hydraulic servo valves)
PCB-0094: Video MUX
PCB-0188: FO Interface (fibre optic serial/video)
PCB-0165: RCM3200 Interface (×5, serial ports, 2 per card = 10 total serial channels)

SEARCH TOOL INSTRUCTIONS:
You have access to a search_manuals tool. Use it to find specific technical details from the manual library.

ALWAYS use the search tool — do not rely on memory alone for specifications, pinouts, procedures, or fault codes.

For each fault or question:
1. Identify ALL possible fault locations (source / path / load)
2. Search for each location separately with targeted queries
3. Synthesise a complete answer covering all fault paths

Search query strategy:
- Camera faults → search "relay board camera power" AND "camera video MUX fibre"
- Comms loss → search "ethernet sixnet switch" AND "CWDM fibre wavelength"
- Hydraulic faults → search "valve pack RS485 curvetech" AND "hydraulic pressure circuit"
- Sensor faults → search "sensor name serial RCM3200" AND "sensor CON number cable"

RESPONSE FORMAT:
- Lead with the most likely fault path
- Give numbered diagnostic steps
- Cite drawing numbers and page references from search results
- State clearly if information is not in the manuals
- Treat Sean as a peer engineer — no padding, no basics`;
}

// ── VOYAGE AI ─────────────────────────────────────────────────────────────────
async function embedQuery(text) {
  const res = await fetch('/voyage/embeddings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${voyageKey}` },
    body: JSON.stringify({ model: 'voyage-large-2', input: [text], input_type: 'query' })
  });
  const data = await res.json();
  if (data.error) throw new Error('Voyage: ' + data.error.message);
  return data.data[0].embedding;
}

// ── SUPABASE SEARCH ───────────────────────────────────────────────────────────
async function searchManuals(query, domain = null) {
  const embedding = await embedQuery(query);
  const rpcUrl = `${supabaseUrl}/rest/v1/rpc/match_chunks`;
  const body = { query_embedding: embedding, match_count: TOP_K };
  if (domain) body.domain = domain;

  const res = await fetch(rpcUrl, {
    method: 'POST',
    headers: {
      'apikey': supabaseAnon,
      'Authorization': `Bearer ${supabaseAnon}`,
      'Content-Type': 'application/json',
      'x-supabase-url': supabaseUrl
    },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error('Search failed: ' + JSON.stringify(data));
  return data;
}

// ── TOOL DEFINITION ───────────────────────────────────────────────────────────
const TOOLS = [{
  name: 'search_manuals',
  description: `Search the ROV technical manual library using semantic (meaning-based) search. Use this to find specific specifications, procedures, pinouts, fault codes, and drawing details. 
  
  Search strategy: Use targeted technical queries. For fault finding, search each possible fault location separately. 
  Examples:
  - "relay board camera power 24V switching"
  - "CWDM 1490nm ethernet fibre loss"
  - "valve pack RS485 curvetech serial fault"
  - "MAX124 PSU 24V bus backplane"
  - "drawing HCV-0015-D-0201-90 control chassis wiring"`,
  input_schema: {
    type: 'object',
    properties: {
      query: { type: 'string', description: 'Specific technical search query — use precise ROV terminology' },
      reasoning: { type: 'string', description: 'Why you are searching for this — which fault path are you investigating' }
    },
    required: ['query', 'reasoning']
  }
}];

// ── AGENTIC LOOP ──────────────────────────────────────────────────────────────
async function agenticQuery(userMessage) {
  const allSearchResults = [];
  let loopCount = 0;
  const MAX_LOOPS = 6; // prevent infinite loops

  // Add user message to history
  chatHistory.push({ role: 'user', content: userMessage });

  // Build messages for API
  const messages = chatHistory.map(m => ({ role: m.role, content: m.content }));

  appendThinking('Claude is analysing the fault and deciding what to search for...');

  while (loopCount < MAX_LOOPS) {
    loopCount++;

    // Call Claude with tools
    const res = await fetch('/anthropic/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': anthropicKey },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        system: systemPrompt,
        tools: TOOLS,
        messages: messages
      })
    });

    const data = await res.json();
    if (data.error) throw new Error('Claude API: ' + data.error.message);

    // Remove previous thinking indicator
    removeThinking();

    // Process response content blocks
    const assistantContent = data.content;
    messages.push({ role: 'assistant', content: assistantContent });

    // Check for tool use
    const toolUseBlocks = assistantContent.filter(b => b.type === 'tool_use');
    const textBlocks = assistantContent.filter(b => b.type === 'text');

    // Show any text blocks
    for (const block of textBlocks) {
      if (block.text && block.text.trim()) {
        if (data.stop_reason === 'end_turn') {
          // Final answer
          appendAssistantMessage(block.text, allSearchResults);
        }
        // Intermediate thinking text — skip display
      }
    }

    // If no tool calls, we're done
    if (toolUseBlocks.length === 0 || data.stop_reason === 'end_turn') {
      break;
    }

    // Execute tool calls
    const toolResults = [];
    for (const toolUse of toolUseBlocks) {
      appendToolCall(toolUse.input.query, toolUse.input.reasoning);
      appendThinking(`Searching: "${toolUse.input.query}"...`);

      try {
        const results = await searchManuals(toolUse.input.query);
        allSearchResults.push(...results);

        const resultText = results.length > 0
          ? results.map(r => `[${r.manual_name || 'Manual'} | ${r.page_label || ''} | similarity: ${r.similarity?.toFixed(3) || '?'}]\n${r.text}`).join('\n\n---\n\n')
          : 'No relevant results found for this query.';

        removeThinking();
        appendToolResult(results, toolUse.input.query);

        toolResults.push({
          type: 'tool_result',
          tool_use_id: toolUse.id,
          content: resultText
        });
      } catch (err) {
        removeThinking();
        toolResults.push({
          type: 'tool_result',
          tool_use_id: toolUse.id,
          content: 'Search error: ' + err.message
        });
      }
    }

    // Add tool results and continue loop
    messages.push({ role: 'user', content: toolResults });

    // Show thinking for next iteration
    if (loopCount < MAX_LOOPS) {
      appendThinking('Analysing search results and deciding next steps...');
    }
  }

  // Update chat history with final messages
  chatHistory = messages.filter(m => typeof m.content === 'string' || (Array.isArray(m.content) && m.content[0]?.type === 'text'));
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function appendThinking(text) {
  removeThinking();
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'thinking-indicator';
  div.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0d1020;border:1px solid #1a2030;border-left:3px solid #00b4d8;border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#5a7080';
  div.innerHTML = `<span class="spinner spinner-teal"></span>${text}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeThinking() {
  document.getElementById('thinking-indicator')?.remove();
}

function appendToolCall(query, reasoning) {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
    <div class="msg-role tool">🔍 Searching manuals</div>
    <div class="msg-bubble tool-call">Query: "${query}"\nReasoning: ${reasoning}</div>
  `;
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendToolResult(results, query) {
  if (!results || results.length === 0) return;
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');

  const pills = results.map((r, i) => {
    const score = r.similarity?.toFixed(3) || '?';
    const simClass = parseFloat(score) > 0.75 ? 'color:#4a9a6a' : parseFloat(score) > 0.6 ? 'color:#a0904a' : 'color:#5a6070';
    return `<span class="chunk-pill" style="${simClass}" onclick="toggleChunk('result-${query.slice(0,10)}-${i}')">${r.manual_name?.split(' ').slice(0,3).join(' ') || 'Manual'} · ${r.page_label || ''} · ${score}</span>
            <div class="chunk-drawer" id="result-${query.slice(0,10)}-${i}">${r.text}</div>`;
  }).join('');

  wrapper.innerHTML = `
    <div class="msg-role tool">📄 Found ${results.length} relevant sections</div>
    <div class="msg-bubble tool-result">
      <div style="margin-bottom:6px;font-size:10px;color:#3a5a3a">Retrieved chunks — click to expand</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${pills}</div>
    </div>
  `;
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function toggleChunk(id) {
  document.getElementById(id)?.classList.toggle('open');
}

function appendAssistantMessage(text, searchResults) {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  const role = document.createElement('div');
  role.className = 'msg-role assistant';
  role.textContent = 'Manual AI';
  wrapper.appendChild(role);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble assistant';
  bubble.textContent = text;
  wrapper.appendChild(bubble);

  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendUserMessage(text) {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="msg-role user">Sean</div><div class="msg-bubble user">${text}</div>`;
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const field = document.getElementById('input-field');
  const q = field.value.trim();
  if (!q || isLoading) return;
  field.value = '';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  appendUserMessage(q);

  try {
    await agenticQuery(q);
  } catch (err) {
    removeThinking();
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.innerHTML = `<div class="msg-role assistant">Manual AI</div><div class="msg-bubble assistant">Error: ${err.message}</div>`;
    msgs.appendChild(div);
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
}

// ── AUTO-INIT FROM SERVER CONFIG ─────────────────────────────────────────────
async function initFromConfig() {
  try {
    const res = await fetch('/config');
    const cfg = await res.json();

    anthropicKey = cfg.anthropicKey  || '';
    voyageKey    = cfg.voyageKey     || '';
    supabaseUrl  = cfg.supabaseUrl   || '';
    supabaseAnon = cfg.supabaseAnon  || '';
    systemPrompt = buildSystemPrompt();

    if (!anthropicKey || !voyageKey || !supabaseUrl) {
      document.querySelector('#key-screen .card').innerHTML = `
        <div class="card-label" style="color:#c0504a">Configuration Error</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c0504a;margin-top:8px">
          Missing API keys on server.<br>Check Railway environment variables:<br>
          ANTHRIPIC_KEY, VOYAGE_KEY, SUPABASE_URL, SUPABASE_ANON
        </div>`;
      return;
    }

    document.getElementById('key-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('chat-screen').style.flexDirection = 'column';
    document.getElementById('send-btn').disabled = false;
    document.getElementById('status-bar').textContent = 'AGENTIC MODE ACTIVE · SEMANTIC SEARCH · TIER 1 LOADED';

    const msgs = document.getElementById('messages');
    msgs.innerHTML = `<div class="msg-wrapper"><div class="msg-role assistant">Manual AI</div><div class="msg-bubble assistant">Ready. I have the Hercules MK3 system architecture loaded.\n\nAsk me anything — describe a fault in plain English and I'll search the relevant manuals, trace the complete fault path, and give you a structured diagnostic sequence.\n\nI'll show you exactly what I'm searching for and why.</div></div>`;

  } catch (err) {
    document.querySelector('#key-screen .card').innerHTML = `
      <div class="card-label" style="color:#c0504a">Connection Error</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c0504a;margin-top:8px">
        Could not reach server: ${err.message}
      </div>`;
  }
}

// Start on load
initFromConfig();

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('input-field').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
